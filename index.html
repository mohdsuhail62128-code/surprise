<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    background: radial-gradient(circle at center, #1a0b2e 0%, #0a0416 100%);
    color: #fff;
  }

  /* ===== STEP 1: START SCREEN ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #2a0a2e 0%, #0a0416 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    transition: opacity 1s ease, visibility 1s;
    text-align: center;
    padding: 20px;
  }
  #startScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .gift-icon {
    font-size: 90px;
    animation: bounceGift 2s infinite;
    filter: drop-shadow(0 0 30px #ff4d88);
    margin-bottom: 30px;
  }
  @keyframes bounceGift {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.1); }
  }

  .start-title {
    font-size: clamp(24px, 4vw, 36px);
    color: #ffd6e7;
    font-style: italic;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255, 77, 136, 0.6);
  }

  .start-subtitle {
    font-size: clamp(14px, 2vw, 18px);
    color: #ffb3d1;
    margin-bottom: 40px;
    opacity: 0.85;
    max-width: 500px;
    line-height: 1.6;
  }

  .start-btn {
    padding: 18px 55px;
    font-size: 20px;
    font-family: 'Georgia', serif;
    font-style: italic;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff4d88, #c7155c, #ff4d88);
    background-size: 200% 200%;
    border: 2px solid #ffb3d1;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(255, 77, 136, 0.7),
                0 8px 25px rgba(0, 0, 0, 0.5);
    transition: all 0.4s ease;
    animation: btnPulse 2s infinite;
  }
  .start-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 50px rgba(255, 77, 136, 1),
                0 12px 35px rgba(0, 0, 0, 0.6);
  }
  .start-btn:active { transform: scale(0.96); }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 77, 136, 0.7), 0 8px 25px rgba(0, 0, 0, 0.5); }
    50% { box-shadow: 0 0 55px rgba(255, 77, 136, 1), 0 8px 25px rgba(0, 0, 0, 0.5); }
  }

  /* ===== STEP 2: LOADER ===== */
  #loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #2a0a2e 0%, #0a0416 100%);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #loader.show { display: flex; }
  #loader.hide { opacity: 0; visibility: hidden; }

  .loader-heart {
    font-size: 70px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 25px #ff4d88);
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
  }
  .loader-text {
    margin-top: 28px;
    font-size: 20px;
    color: #ffb3d1;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 20px;
    font-style: italic;
    animation: fadeInOut 3s infinite;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .countdown {
    margin-top: 18px;
    font-size: 22px;
    color: #ff4d88;
    letter-spacing: 4px;
    font-weight: bold;
    text-shadow: 0 0 15px #ff4d88;
  }

  /* ===== SCENE ===== */
  #scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  /* ===== ROSE ===== */
  .rose-wrapper {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(110%);
    opacity: 0;
    transition: transform 3.5s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 2s ease;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .rose-wrapper.rise {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .rose-svg {
    width: 220px;
    height: 220px;
    transform: scale(0) rotate(-45deg);
    transform-origin: center 90%;
    transition: transform 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s;
    filter: drop-shadow(0 0 35px rgba(255, 20, 80, 0.9))
            drop-shadow(0 0 15px rgba(255, 107, 157, 0.7));
  }
  .rose-wrapper.rise .rose-svg {
    transform: scale(1) rotate(0deg);
  }

  .stem-svg {
    width: 40px;
    height: 320px;
    margin-top: -20px;
    filter: drop-shadow(0 0 8px rgba(60, 200, 100, 0.5));
  }

  /* ===== NAME ===== */
  .message-container {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 90%;
    max-width: 750px;
    opacity: 0;
    transition: opacity 1.5s ease 1.5s;
    z-index: 20;
    pointer-events: none;
  }
  .message-container.show { opacity: 1; }

  .name {
    font-size: clamp(42px, 9vw, 100px);
    font-family: 'Georgia', serif;
    font-style: italic;
    font-weight: bold;
    background: linear-gradient(45deg, #ff6b9d, #ffd6e7, #ff4d88, #ffb3d1, #ff6b9d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s ease infinite;
    letter-spacing: 3px;
    filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.8));
  }
  @keyframes shine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* ===== STEP 3: GREETING BOX ===== */
  #greetingBox {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(200%);
    z-index: 30;
    opacity: 0;
    transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.8s ease;
    pointer-events: none;
  }
  #greetingBox.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .greeting-card {
    background: linear-gradient(135deg, rgba(255, 77, 136, 0.25), rgba(139, 0, 51, 0.4));
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 179, 209, 0.6);
    border-radius: 25px;
    padding: 22px 40px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 77, 136, 0.6),
                0 15px 40px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    transition: all 0.4s ease;
    animation: cardGlow 2.5s infinite;
  }
  @keyframes cardGlow {
    0%, 100% { box-shadow: 0 0 40px rgba(255, 77, 136, 0.6), 0 15px 40px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 65px rgba(255, 77, 136, 1), 0 15px 40px rgba(0,0,0,0.5); }
  }
  .greeting-card:hover {
    transform: scale(1.06);
    border-color: #ffd6e7;
  }
  .greeting-card:active { transform: scale(0.97); }

  .greeting-heart {
    font-size: 32px;
    margin-bottom: 8px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 15px #ff4d88);
    display: inline-block;
  }

  .greeting-text {
    font-size: clamp(15px, 2vw, 19px);
    color: #fff;
    font-style: italic;
    letter-spacing: 1.5px;
    text-shadow: 0 0 12px rgba(255, 77, 136, 0.8);
    font-weight: bold;
  }

  .tap-hint {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    color: #ffb3d1;
    letter-spacing: 2px;
    opacity: 0.85;
    animation: tapPulse 1.5s infinite;
  }
  @keyframes tapPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* ===== STEP 4: FINAL MESSAGE MODAL ===== */
  #messageModal {
    position: fixed;
    inset: 0;
    background: rgba(10, 4, 22, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 40;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s;
    padding: 20px;
  }
  #messageModal.show {
    opacity: 1;
    visibility: visible;
  }

  .message-card {
    background: linear-gradient(160deg, #2a0a2e 0%, #4a0e3a 50%, #2a0a2e 100%);
    border: 2px solid #ff6b9d;
    border-radius: 30px;
    padding: 45px 35px;
    max-width: 550px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 77, 136, 0.7),
                0 25px 60px rgba(0, 0, 0, 0.6);
    transform: scale(0.5) rotate(-10deg);
    transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #messageModal.show .message-card {
    transform: scale(1) rotate(0deg);
  }

  .message-icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: heartbeat 1.5s infinite;
    filter: drop-shadow(0 0 25px #ff4d88);
    display: inline-block;
  }

  .message-title {
    font-size: clamp(22px, 4vw, 32px);
    font-style: italic;
    font-weight: bold;
    margin-bottom: 25px;
    letter-spacing: 2px;
    background: linear-gradient(45deg, #ff6b9d, #ffd6e7, #ff4d88);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s ease infinite;
  }

  .message-body {
    font-size: clamp(15px, 2.3vw, 19px);
    color: #ffe8f1;
    line-height: 1.9;
    font-style: italic;
    letter-spacing: 0.5px;
    padding: 0 10px;
  }

  .close-btn {
    margin-top: 30px;
    padding: 12px 35px;
    font-size: 15px;
    font-family: 'Georgia', serif;
    font-style: italic;
    color: #fff;
    background: linear-gradient(135deg, #ff4d88, #c7155c);
    border: 2px solid #ffb3d1;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(255, 77, 136, 0.6);
    transition: all 0.3s ease;
  }
  .close-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(255, 77, 136, 1);
  }

  /* ===== Effects ===== */
  .falling-petal {
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle at 30% 30%, #ff88b0, #c7155c 70%, #7a0030);
    border-radius: 50% 0 50% 50%;
    top: -30px;
    animation: fall linear infinite;
    opacity: 0.85;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .floating-heart {
    position: absolute;
    pointer-events: none;
    animation: floatUp linear infinite;
    opacity: 0;
    text-shadow: 0 0 12px #ff4d88;
    z-index: 15;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.4); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  .ground-glow {
    position: absolute;
    bottom: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 250px;
    background: radial-gradient(ellipse, rgba(255, 77, 136, 0.5), transparent 70%);
    filter: blur(40px);
    z-index: 1;
    opacity: 0;
    transition: opacity 2.5s ease 1s;
  }
  .ground-glow.show { opacity: 1; }
</style>
</head>
<body>

  <!-- ===== STEP 1: START SCREEN ===== -->
  <div id="startScreen">
    <div class="gift-icon">🎁</div>
    <div class="start-title">Kuch khaas hai tumhare liye...</div>
    <div class="start-subtitle">Ek chhoti si surprise tumhara intezaar kar rahi hai ❤️</div>
    <button class="start-btn" id="startBtn">Tap to Open ❤️</button>
  </div>

  <!-- ===== STEP 2: LOADER ===== -->
  <div id="loader">
    <div class="loader-heart">❤️</div>
    <div class="loader-text">Ek chhoti si surprise ban rahi hai tumhare liye...</div>
    <div class="countdown" id="countdown">10</div>
  </div>

  <!-- ===== SCENE ===== -->
  <div id="scene">
    <div class="ground-glow" id="glow"></div>

    <div class="rose-wrapper" id="roseWrapper">
      <svg class="rose-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petalGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffc2d6"/>
            <stop offset="30%" stop-color="#ff85b3"/>
            <stop offset="65%" stop-color="#e91e63"/>
            <stop offset="100%" stop-color="#8b0033"/>
          </radialGradient>
          <radialGradient id="petalGrad2" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#ffd6e7"/>
            <stop offset="40%" stop-color="#ff6b9d"/>
            <stop offset="100%" stop-color="#a30d4d"/>
          </radialGradient>
          <radialGradient id="petalGradDark" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#ff4d88"/>
            <stop offset="50%" stop-color="#c7155c"/>
            <stop offset="100%" stop-color="#5c0020"/>
          </radialGradient>
          <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd6e7"/>
            <stop offset="50%" stop-color="#ff4d88"/>
            <stop offset="100%" stop-color="#7a0030"/>
          </radialGradient>
        </defs>

        <g>
          <path d="M100 30 Q 130 50 125 95 Q 115 105 100 100 Q 85 105 75 95 Q 70 50 100 30 Z" fill="url(#petalGrad2)" opacity="0.95"/>
          <path d="M170 100 Q 150 130 105 125 Q 95 115 100 100 Q 95 85 105 75 Q 150 70 170 100 Z" fill="url(#petalGrad2)" opacity="0.95"/>
          <path d="M100 170 Q 70 150 75 105 Q 85 95 100 100 Q 115 95 125 105 Q 130 150 100 170 Z" fill="url(#petalGrad2)" opacity="0.95"/>
          <path d="M30 100 Q 50 70 95 75 Q 105 85 100 100 Q 105 115 95 125 Q 50 130 30 100 Z" fill="url(#petalGrad2)" opacity="0.95"/>
        </g>

        <g>
          <path d="M135 45 Q 155 75 130 105 Q 115 110 100 100 Q 100 80 135 45 Z" fill="url(#petalGrad)"/>
          <path d="M155 135 Q 125 155 95 130 Q 90 115 100 100 Q 120 100 155 135 Z" fill="url(#petalGrad)"/>
          <path d="M65 155 Q 45 125 70 95 Q 85 90 100 100 Q 100 120 65 155 Z" fill="url(#petalGrad)"/>
          <path d="M45 65 Q 75 45 105 70 Q 110 85 100 100 Q 80 100 45 65 Z" fill="url(#petalGrad)"/>
        </g>

        <g>
          <path d="M115 55 Q 135 75 115 100 Q 105 105 100 100 Q 100 80 115 55 Z" fill="url(#petalGradDark)" opacity="0.9"/>
          <path d="M145 115 Q 125 135 100 115 Q 95 105 100 100 Q 120 100 145 115 Z" fill="url(#petalGradDark)" opacity="0.9"/>
          <path d="M85 145 Q 65 125 85 100 Q 95 95 100 100 Q 100 120 85 145 Z" fill="url(#petalGradDark)" opacity="0.9"/>
          <path d="M55 85 Q 75 65 100 85 Q 105 95 100 100 Q 80 100 55 85 Z" fill="url(#petalGradDark)" opacity="0.9"/>
        </g>

        <circle cx="100" cy="100" r="18" fill="url(#centerGrad)" opacity="0.85"/>
        <circle cx="100" cy="100" r="11" fill="#a30d4d" opacity="0.75"/>
        <path d="M100 92 Q 108 95 106 103 Q 102 108 96 106 Q 92 100 100 92 Z" fill="#ffd6e7" opacity="0.6"/>
        <circle cx="100" cy="100" r="4" fill="#7a0030"/>

        <ellipse cx="75" cy="60" rx="14" ry="8" fill="#ffd6e7" opacity="0.25" transform="rotate(-30 75 60)"/>
        <ellipse cx="128" cy="75" rx="12" ry="6" fill="#ffd6e7" opacity="0.2" transform="rotate(40 128 75)"/>
      </svg>

      <svg class="stem-svg" viewBox="0 0 40 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#145a26"/>
            <stop offset="45%" stop-color="#3ea55c"/>
            <stop offset="55%" stop-color="#5cc878"/>
            <stop offset="100%" stop-color="#0f4a1e"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5cc878"/>
            <stop offset="60%" stop-color="#2d8a45"/>
            <stop offset="100%" stop-color="#0f4a1e"/>
          </linearGradient>
          <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4cbc68"/>
            <stop offset="60%" stop-color="#1e6e34"/>
            <stop offset="100%" stop-color="#0f4a1e"/>
          </linearGradient>
        </defs>

        <path d="M20 0 Q 22 80 20 160 Q 18 240 20 320" stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

        <g transform="translate(20, 110)">
          <path d="M0 0 Q -30 -8 -42 5 Q -32 15 0 3 Z" fill="url(#leafGrad)"/>
        </g>
        <g transform="translate(20, 170)">
          <path d="M0 0 Q 30 -10 44 4 Q 32 15 0 3 Z" fill="url(#leafGrad2)"/>
        </g>
        <g transform="translate(20, 230)">
          <path d="M0 0 Q -28 -6 -38 6 Q -28 16 0 3 Z" fill="url(#leafGrad)"/>
        </g>
      </svg>
    </div>

    <div class="message-container" id="messageContainer">
      <div class="name" id="nameText">Her Name</div>
    </div>
  </div>

  <!-- ===== STEP 3: GREETING BOX ===== -->
  <div id="greetingBox">
    <div class="greeting-card" id="greetingCard">
      <div class="greeting-heart">💌</div>
      <div class="greeting-text">Tap to see message for you</div>
      <span class="tap-hint">✦ tap here ✦</span>
    </div>
  </div>

  <!-- ===== STEP 4: FINAL MESSAGE MODAL ===== -->
  <div id="messageModal">
    <div class="message-card">
      <div class="message-icon">💖</div>
      <div class="message-title">For You, My Love</div>
      <div class="message-body" id="finalMessage"></div>
      <button class="close-btn" id="closeBtn">Close 💗</button>
    </div>
  </div>

<script>
  /* ============================================================
     CONFIG — YAHAN APNI DETAILS DAALO 👇
     ============================================================ */
  const GIRLFRIEND_NAME = "Dear muthawa ";  // 👈 Uska naam
  const LOADING_MESSAGE = "Ek chhoti si surprise ban rahi hai tumhare liye...";
  const LOADING_SECONDS = 10;

  const FINAL_MESSAGE = `Tum meri zindagi ki sabse khoobsurat khushi ho. 🌹<br><br>
    Ye rose tumhare liye — jaise tum mere liye ho. 💖<br><br>
    Har din tumhare saath aur bhi khaas ban jaata hai. Thank you for being mine. 💕`;

  /* ============================================================
     Elements
     ============================================================ */
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const loader = document.getElementById('loader');
  const countdownEl = document.getElementById('countdown');
  const roseWrapper = document.getElementById('roseWrapper');
  const messageContainer = document.getElementById('messageContainer');
  const nameText = document.getElementById('nameText');
  const glow = document.getElementById('glow');
  const scene = document.getElementById('scene');
  const greetingBox = document.getElementById('greetingBox');
  const greetingCard = document.getElementById('greetingCard');
  const messageModal = document.getElementById('messageModal');
  const finalMessage = document.getElementById('finalMessage');
  const closeBtn = document.getElementById('closeBtn');

  /* ============================================================
     Set Content
     ============================================================ */
  nameText.textContent = GIRLFRIEND_NAME;
  document.querySelector('.loader-text').textContent = LOADING_MESSAGE;
  finalMessage.innerHTML = FINAL_MESSAGE;

  /* ============================================================
     Stars
     ============================================================ */
  for (let i = 0; i < 90; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    scene.appendChild(star);
  }

  /* ============================================================
     Effects
     ============================================================ */
  function createFallingPetals() {
    for (let i = 0; i < 30; i++) {
      const petal = document.createElement('div');
      petal.className = 'falling-petal';
      petal.style.left = Math.random() * 100 + '%';
      petal.style.animationDuration = (Math.random() * 5 + 6) + 's';
      petal.style.animationDelay = Math.random() * 10 + 's';
      const scale = Math.random() * 0.9 + 0.5;
      petal.style.transform = `scale(${scale})`;
      scene.appendChild(petal);
    }
  }

  function createFloatingHearts() {
    const hearts = ['💖', '🌹', '💕', '❤️', '💗', '🌸'];
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.bottom = '-40px';
      heart.style.fontSize = (Math.random() * 18 + 16) + 'px';
      heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
      scene.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 500);
  }

  /* ============================================================
     STEP 1: Start button click
     ============================================================ */
  startBtn.addEventListener('click', function() {
    // Hide start screen
    startScreen.classList.add('hide');

    // Show loader
    setTimeout(() => {
      loader.classList.add('show');
      startCountdown();
    }, 400);
  });

  /* ============================================================
     STEP 2: Countdown
     ============================================================ */
  function startCountdown() {
    let timeLeft = LOADING_SECONDS;
    countdownEl.textContent = timeLeft;

    const countdownInterval = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft > 0 ? timeLeft : "🌹";
      if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        startRoseAnimation();
      }
    }, 1000);
  }

  /* ============================================================
     STEP 3: Rose animation
     ============================================================ */
  function startRoseAnimation() {
    // Hide loader
    loader.classList.add('hide');
    setTimeout(() => {
      loader.style.display = 'none';

      // Rose rises
      roseWrapper.classList.add('rise');
      glow.classList.add('show');

      // Show name
      setTimeout(() => {
        messageContainer.classList.add('show');
      }, 1800);

      // Start effects
      createFallingPetals();
      createFloatingHearts();

      // Show greeting box after rose fully blooms
      setTimeout(() => {
        greetingBox.classList.add('show');
      }, 4000);
    }, 400);
  }

  /* ============================================================
     STEP 4: Greeting card click → show final message
     ============================================================ */
  greetingCard.addEventListener('click', function() {
    messageModal.classList.add('show');
  });

  /* ============================================================
     Close button
     ============================================================ */
  closeBtn.addEventListener('click', function() {
    messageModal.classList.remove('show');
  });

  // Also close when clicking outside the card
  messageModal.addEventListener('click', function(e) {
    if (e.target === messageModal) {
      messageModal.classList.remove('show');
    }
  });
</script>
</body>
</html>
